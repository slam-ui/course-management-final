spring:
  application:
    name: course-management
  h2:
    console:
      enabled: false  # ИСПРАВЛЕНО: отключено в production
      # path: /h2-console  # удалено
      # settings:
      #   web-allow-others: true  # удалено
  datasource:
    url: jdbc:h2:mem:courseapp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    show-sql: false  # ИСПРАВЛЕНО: отключено в production
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

management:
  endpoints:
    web:
      exposure:
        include: health,info  # ИСПРАВЛЕНО: ограничено
  endpoint:
    health:
      show-details: when-authorized

server:
  error:
    include-stacktrace: never  # ИСПРАВЛЕНО: скрыто в production

