name: Java CI with Maven

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:

  # 1. Сборка проекта
  build:
    runs-on: ubuntu-latest
    container: maven:3.9-eclipse-temurin-21
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: course-management-jar
          path: target/*.jar
          retention-days: 5

  # 2. SAST (Semgrep)
  sast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Semgrep Security Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default
          generateSarif: "1"

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        if: always()

  # 3. SCA (Dependency Check)
  dependency-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check -Dformat=HTML -DsuppressionFile=owasp-suppressions.xml

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

  # 4. DAST (OWASP ZAP) - Задание №5
  dast:
    needs: build
    runs-on: ubuntu-latest
    # Разрешаем продолжить, даже если ZAP найдет уязвимости (чтобы получить отчет)
    continue-on-error: true
    permissions:
      contents: read
      issues: write # Требуется для корректной работы ZAP Actions
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Настройка Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 2. Скачивание JAR
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: course-management-jar
          path: target/

      # 3. Запуск приложения в фоне
      - name: Start Application
        run: |
          nohup java -jar target/*.jar > app.log 2>&1 &
          echo "Application started in background. Waiting 60 seconds..."
          sleep 60

      # 4. Базовое сканирование (ZAP Baseline)
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: 'zap-rules.tsv'
          allow_issue_writing: false
          cmd_options: '-a'

      # 5. Сканирование API (ZAP API Scan)
      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: 'http://localhost:8080/v3/api-docs'
          format: 'openapi'
          rules_file_name: 'zap-rules.tsv'
          allow_issue_writing: false

      # 6. Загрузка всех отчетов (HTML)
      - name: Upload ZAP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-reports
          path: |
            *.html
            *.json
            *.md
