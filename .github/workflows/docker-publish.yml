name: Java CI with Maven

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:


  build:
    runs-on: ubuntu-latest
    container: maven:3.9-eclipse-temurin-21
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: course-management-jar
          path: target/*.jar
          retention-days: 5


  sast:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Semgrep Security Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default
          generateSarif: "1"

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        if: always()


  dependency-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven


      - name: OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check -Dformat=HTML -DsuppressionFile=owasp-suppressions.xml


      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          
  dast:
    needs: build
    runs-on: ubuntu-latest
    # Разрешаем продолжить, даже если ZAP найдет уязвимости
    continue-on-error: true 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Нам нужна Java, чтобы запустить приложение
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 2. Скачиваем JAR-файл, который собрали в задаче build
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: course-management-jar # Имя должно совпадать с тем, что в задаче build (upload-artifact)
          path: target/

      # 3. Запускаем приложение в фоне
      - name: Start Application
        run: |
          nohup java -jar target/*.jar > app.log 2>&1 &
          echo "Application started in background. Waiting 30 seconds..."
          sleep 30

      # 4. ZAP Baseline Scan (Базовое сканирование)
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: 'zap-rules.tsv'
          allow_issue_writing: false # Не создавать Issues в репозитории (для учебных целей)
          cmd_options: '-a' # Доп. флаги если нужно

      # 5. ZAP API Scan (Сканирование API)
      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: 'http://localhost:8080/v3/api-docs' # Ссылка на Swagger JSON
          format: 'openapi'
          rules_file_name: 'zap-rules.tsv'
          allow_issue_writing: false

      # 6. Загрузка отчетов (ZAP Actions сохраняют отчеты в текущую папку)
      # Обычно файлы называются report_html.html или похоже, но ZAP Action их переименовывает внутри.
      # Action baseline создает report_html.html по умолчанию. Мы загрузим всё что похоже на html.
      - name: Upload ZAP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-reports
          path: |
            report_html.html
            report_json.json
            report_md.md
